<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="referrer" content="no-referrer">
  <title>Silicon Dopes</title>
  <link rel="icon" href="/static/si-logo-light.png">
  <link rel="stylesheet" href="/static/app.css?v=boards1">
  <script src="/static/app.js?v=boards1" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Silicon Dopes home"><img src="/static/si-logo-light.png" width="30" height="30" alt="">Silicon <strong>Dopes</strong></a>
    <details id="account-menu" class="account-menu" hidden>
      <summary><span class="avatar" id="initial"></span><span id="account-name"></span><span class="chevron" aria-hidden="true"></span></summary>
      <div class="menu-pop"><span id="account-handle"></span><a href="/api/auth/login">Switch account</a><button id="logout">Sign out</button></div>
    </details>
  </header>
  <main id="loading" class="centered" aria-live="polite">Loading boards…</main>
  <main id="signin" class="centered" hidden>
    <section class="signin-card">
      <img src="/static/si-logo-light.png" width="48" height="48" alt="">
      <h1>Silicon Dopes</h1>
      <p>Your team’s dope lists, or a board of your own.</p>
      <p id="signin-message" class="notice" role="status" hidden></p>
      <a class="primary" href="/api/auth/login">Sign in with Silicon Accounts <span aria-hidden="true">↗</span></a>
    </section>
  </main>
  <div id="workspace" class="workspace" hidden>
    <aside class="sidebar" aria-label="Boards">
      <h2>Boards</h2>
      <nav id="boards" aria-label="Select a board"></nav>
    </aside>
    <main class="board-content">
      <div class="mobile-boards"><label for="board-select">Board</label><select id="board-select"></select></div>
      <p class="board-context" id="board-context"></p>
      <h1 id="board-title"></h1>
      <form id="composer" class="composer">
        <label for="description" class="sr-only">Dope description</label>
        <textarea id="description" rows="2" maxlength="20000" placeholder="What needs doing?" required></textarea>
        <div class="compose-bottom"><span class="key-hint" id="shortcut"></span><button class="primary" type="submit" id="add"><span aria-hidden="true">＋</span> Add dope</button></div>
      </form>
      <div class="list-tools">
        <div id="filters" class="filters" role="group" aria-label="Dope status"></div>
        <label class="search"><span class="search-icon" aria-hidden="true"></span><span class="sr-only">Search dopes</span><input id="search" type="search" placeholder="Search dopes" autocomplete="off"></label>
      </div>
      <p id="list-status" role="status"></p>
      <ul id="dopes" class="dope-list" aria-label="Dopes"></ul>
    </main>
  </div>
  <div id="notice" class="notification" role="status" hidden><span></span><button id="retry" type="button" hidden>Retry</button><button id="dismiss" aria-label="Dismiss message">×</button></div>
  <dialog id="detail" aria-labelledby="detail-title">
    <form method="dialog" class="dialog-close"><button aria-label="Close">×</button></form>
    <div id="detail-body"></div>
  </dialog>
  <noscript>Enable JavaScript to use Silicon Dopes.</noscript>
</body>
</html>
