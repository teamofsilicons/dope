log_format dopes '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name dopes.teamofsilicons.com;
    access_log /var/log/nginx/dopes.access.log dopes;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://dopes.teamofsilicons.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dopes.teamofsilicons.com;
    ssl_certificate /etc/letsencrypt/live/dopes.teamofsilicons.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dopes.teamofsilicons.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/dopes.access.log dopes;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host dopes.teamofsilicons.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
